apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
    name: demo-app
    namespace: argocd
spec:
    project: default
    source: 
        repoURL: https://github.com/johnsonstark/golden-pipeline-gitops.git
        targetRevision: main
        path: app
    destination:
        server: https://kubernetes.default.svc
        namespace: demo-app
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
